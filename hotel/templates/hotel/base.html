<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NestAway Suites{% endblock %}</title>
  {% load static %}
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f8fafc;
      color: #1f2937;
      line-height: 1.6;
    }
    a {
      color: inherit;
    }
    .site-nav {
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
    }
    .site-nav .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .site-nav .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: #2563eb;
      text-decoration: none;
    }
    .site-nav .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .site-nav .nav-links a {
      color: #1f2937;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .site-nav .nav-links a:hover {
      color: #2563eb;
    }
    .page-content {
      padding: 1rem 1.5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 640px) {
      .site-nav .nav-inner {
        flex-direction: column;
        align-items: stretch;
      }
      .site-nav .nav-links {
        justify-content: space-between;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="{% url 'home' %}">NestAway Suites</a>
      <nav class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="{% url 'dashboard' %}">Dashboard</a>
      </nav>
    </div>
  </header>
  <main class="page-content">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
